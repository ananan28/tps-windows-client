name: Windows test build
on:
  push:
    branches: [main]
    paths: ['**.py', 'requirements.txt', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-main
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements.txt pyinstaller==6.19.0
      - name: Ensure no bundled browser payload
        shell: pwsh
        run: |
          $package = python -c "import pathlib, playwright; print(pathlib.Path(playwright.__file__).parent)"
          $payload = Join-Path $package 'driver/package/.local-browsers'
          if (Test-Path $payload) { throw 'Unexpected bundled browser payload' }
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Build portable Windows client
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name TPSWindowsClient --collect-all playwright app.py
      - name: Smoke test actual packaged executable offline
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath '.\dist\TPSWindowsClient\TPSWindowsClient.exe' -ArgumentList '--self-test' -PassThru
          if (-not $proc.WaitForExit(120000)) { $proc.Kill(); throw 'Packaged smoke test timed out' }
          if ($proc.ExitCode -ne 0) { throw "Smoke test failed: $($proc.ExitCode)" }
          if (-not (Test-Path self-test-result.json)) { throw 'Smoke test evidence missing' }
          Copy-Item QUICKSTART.txt dist\TPSWindowsClient\QUICKSTART.txt
      - name: Defender scan before publishing
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path security-evidence -Force | Out-Null
          $status = Get-MpComputerStatus
          $status | Select-Object AntivirusEnabled,AntivirusSignatureVersion,AntivirusSignatureLastUpdated | ConvertTo-Json | Set-Content security-evidence/defender-status.json
          if (-not $status.AntivirusEnabled) { throw 'Defender unavailable' }
          $mp = Get-ChildItem 'C:\ProgramData\Microsoft\Windows Defender\Platform\*\MpCmdRun.exe' | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $mp) { throw 'Defender command missing' }
          & $mp.FullName -Scan -ScanType 3 -File (Join-Path (Get-Location) 'dist/TPSWindowsClient') -DisableRemediation 2>&1 | Tee-Object security-evidence/scan.txt
          $scanExit = $LASTEXITCODE
          @{exit_code=$scanExit;chrome_safe_browsing='not_tested'} | ConvertTo-Json | Set-Content security-evidence/result.json
          Get-FileHash dist/TPSWindowsClient/TPSWindowsClient.exe -Algorithm SHA256 | ConvertTo-Json | Set-Content security-evidence/exe-hash.json
          if ($scanExit -ne 0) { throw "Defender scan failed: $scanExit" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-evidence-0.1.10
          path: security-evidence/
      - uses: actions/upload-artifact@v4
        with:
          name: TPSWindowsClient-0.1.10-Windows-x64
          path: dist/TPSWindowsClient/
          include-hidden-files: true
          retention-days: 14
      - name: Download uploaded program for round-trip verification
        uses: actions/download-artifact@v4
        with:
          name: TPSWindowsClient-0.1.10-Windows-x64
          path: downloaded-client
      - name: Verify actual downloaded program and browser
        shell: pwsh
        run: |
          Remove-Item self-test-result.json -ErrorAction SilentlyContinue
          $exe = Join-Path (Get-Location) 'downloaded-client\TPSWindowsClient.exe'
          $proc = Start-Process -FilePath $exe -ArgumentList '--self-test' -PassThru
          if (-not $proc.WaitForExit(120000)) { $proc.Kill(); throw 'Downloaded executable timed out' }
          if ($proc.ExitCode -ne 0) { throw "Downloaded executable failed: $($proc.ExitCode)" }
          if (-not (Test-Path self-test-result.json)) { throw 'Downloaded executable evidence missing' }
      - uses: actions/upload-artifact@v4
        with:
          name: offline-smoke-evidence
          path: self-test-result.json
          retention-days: 14
