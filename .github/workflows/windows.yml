name: Windows test build
on:
  push:
    branches: [main]
    paths: ['**.py', 'requirements.txt', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-main
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements.txt pyinstaller==6.19.0
          python -m playwright install chromium
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Build portable Windows client
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name TPSWindowsClient --collect-all playwright app.py
      - name: Smoke test actual packaged executable offline
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath '.\dist\TPSWindowsClient\TPSWindowsClient.exe' -ArgumentList '--self-test' -PassThru
          if (-not $proc.WaitForExit(120000)) { $proc.Kill(); throw 'Packaged smoke test timed out' }
          if ($proc.ExitCode -ne 0) { throw "Smoke test failed: $($proc.ExitCode)" }
          if (-not (Test-Path self-test-result.json)) { throw 'Smoke test evidence missing' }
          Copy-Item QUICKSTART.txt dist\TPSWindowsClient\QUICKSTART.txt
      - uses: actions/upload-artifact@v4
        with:
          name: TPSWindowsClient-0.1.2-Windows-x64
          path: dist/TPSWindowsClient/
          include-hidden-files: true
          retention-days: 14
      - name: Download uploaded program for round-trip verification
        uses: actions/download-artifact@v4
        with:
          name: TPSWindowsClient-0.1.2-Windows-x64
          path: downloaded-client
      - name: Verify actual downloaded program and browser
        shell: pwsh
        run: |
          Remove-Item self-test-result.json -ErrorAction SilentlyContinue
          $exe = Join-Path (Get-Location) 'downloaded-client\TPSWindowsClient.exe'
          $proc = Start-Process -FilePath $exe -ArgumentList '--self-test' -PassThru
          if (-not $proc.WaitForExit(120000)) { $proc.Kill(); throw 'Downloaded executable timed out' }
          if ($proc.ExitCode -ne 0) { throw "Downloaded executable failed: $($proc.ExitCode)" }
          if (-not (Test-Path self-test-result.json)) { throw 'Downloaded executable evidence missing' }
      - uses: actions/upload-artifact@v4
        with:
          name: offline-smoke-evidence
          path: self-test-result.json
          retention-days: 14
